  /auth/openid:
    get:
      deprecated: false
      description: 'This endpoint starts a standard OAuth2 flow with PKCE (required
        - S256; see RFC7636), to log the user in using SSO.


        For the code_challenge, you must randomly generate a minimum 32-byte string
        called verifier (PKCE challenge). With the verifier, you can then generate
        the challenge. See the examples on the right side.


        Also you must generate a random string and send it in the state parameter.


        On a valid request, it will return a 302-redirect (usually with a Location:
        header), which will point to the ABS-configured OAuth2 Provider. It will include
        your generated state-parameter, check if it matches. You would usually then
        have to open this redirect-URL in a Browser to present to the user.


        Note that you will have to preserve the cookies you receive in this call for
        using it in /auth/openid/callback (check if you need to set a parameter for
        the HTTP library you are using for that).


        When the user has logged in (successfully) inside the Browser, the Browser
        will redirect to the URL redirect_uri which should be a URL your website or
        app can open (like a universal app link). The call to the redirect_uri will
        include state and code GET parameters. Check if the state parameter is the
        same as above and use the code for the call to /auth/openid/callback.'
      operationId: oAuthRequest
      parameters:
      - description: PKCE code_challenge you generated from verifier
        in: query
        name: code_challenge
        required: true
        schema:
          type: string
      - description: Must be S256
        example: S256
        in: query
        name: code_challenge_method
        required: true
        schema:
          type: string
      - description: Only code is supported
        example: code
        in: query
        name: response_type
        required: true
        schema:
          type: string
      - description: URL where to redirect after a successful login. Must be whitelisted
          in ABS
        in: query
        name: redirect_uri
        required: true
        schema:
          type: string
      - description: The name of your app (currently not used, but might be required
          at some point)
        in: query
        name: client_id
        required: true
        schema:
          type: string
      - description: A randomly generated string, which must match in subsequent requests
        in: query
        name: state
        required: true
        schema:
          type: string
      responses:
        '302':
          content:
            '*/*':
              schema:
                properties: {}
                type: object
          description: ''
          headers: {}
        '400':
          content:
            application/json:
              schema:
                properties: {}
                type: object
          description: ''
          headers: {}
        '401':
          content:
            '*/*':
              schema:
                properties: {}
                type: object
          description: ''
          headers: {}
      security: []
      summary: OAuth2 Authorization Request
      tags:
      - Server
  /auth/openid/callback:
    get:
      deprecated: false
      description: "This API call finalizes the OAuth2 flow. The behavior of this\
        \ call depends on whether a redirect_uri was provided in the /auth/openid\
        \ request:\n\n    If a redirect_uri was provided, this call returns user JSON\
        \ data.\n    If a redirect_uri was not provided, it will redirect to /login\
        \ (used internally by ABS-web).\n\nIt's important to note that the call to\
        \ /auth/openid/callback is stateful. This means that the cookies set during\
        \ the /auth/openid call must be sent along with this request."
      operationId: oAuthCallback
      parameters:
      - description: The state string you generated in the first request
        in: query
        name: state
        required: true
