components:
  schemas:
    AudioBookmark:
      properties:
        createdAt: &id002
          $ref: '#/components/schemas/createdAt'
        libraryItemId: &id004
          $ref: '#/components/schemas/libraryItemId'
        time:
          description: The time (in seconds) the bookmark is at in the book.
          type: integer
        title:
          description: The title of the bookmark.
          type: string
      type: object
    AudioFile:
      description: An audio file for a book. Includes audio metadata and track numbers.
      properties:
        addedAt: &id010
          $ref: '#/components/schemas/addedAt'
        bitRate:
          description: The bit rate (in bit/s) of the audio file.
          example: '64000'
          type: integer
        channelLayout:
          description: The layout of the audio file's channels.
          example: stereo
          type: string
        channels:
          description: The number of channels the audio file has.
          example: '2'
          type: integer
        chapters:
          description: If the audio file is part of an audiobook, the chapters the
            file contains.
          items: &id003
            $ref: '#/components/schemas/BookChapter'
          type: array
        codec:
          description: The codec of the audio file.
          example: mp3
          type: string
        discNumFromFilename:
          description: The disc number of the audio file as determined from the file's
            name. Will be null if unknown.
          nullable: true
          type: string
        discNumFromMeta:
          description: The disc number of the audio file as pulled from the file's
            metadata. Will be null if unknown.
          nullable: true
          type: string
        duration: &id006
          $ref: '#/components/schemas/durationSec'
        embeddedCoverArt:
          description: The type of embedded cover art in the audio file. Will be null
            if none exists.
          nullable: true
          type: string
        error:
          description: Any error with the audio file. Will be null if there is none.
          nullable: true
          type: string
        exclude:
          description: Whether the audio file has been marked for exclusion.
          type: boolean
        format:
          description: The format of the audio file.
          example: MP2/3 (MPEG audio layer 2/3)
          type: string
        index:
          description: The index of the audio file.
          example: '1'
          type: integer
        ino: &id011
          $ref: '#/components/schemas/inode'
        invalid:
          description: Whether the audio file is missing from the server.
          type: boolean
        language:
          description: The language of the audio file.
          nullable: true
          type: string
        manuallyVerified:
          description: Whether the audio file has been manually verified by a user.
          type: boolean
        metaTags:
          $ref: '#/components/schemas/AudioMetaTags'
        metadata: &id001
          $ref: '#/components/schemas/fileMetadata'
        mimeType:
          description: The MIME type of the audio file.
          example: audio/mpeg
          type: string
        timeBase:
          description: The time base of the audio file.
          example: 1/14112000
          type: string
        trackNumFromFilename:
          description: The track number of the audio file as determined from the file's
            name. Will be null if unknown.
          example: '1'
          nullable: true
          type: integer
        trackNumFromMeta:
          description: The track number of the audio file as pulled from the file's
            metadata. Will be null if unknown.
          example: '1'
          nullable: true
          type: integer
        updatedAt: &id007
          $ref: '#/components/schemas/updatedAt'
      type: object
    AudioMetaTags:
      description: ID3 metadata tags pulled from the audio file on import. Only non-null
        tags will be returned in requests.
      properties:
        tagASIN:
          nullable: true
          type: string
        tagAlbum:
          example: SOT Bk01
          nullable: true
          type: string
        tagAlbumArtist:
          example: Terry Goodkind
          nullable: true
          type: string
        tagArtist:
          example: Terry Goodkind
          nullable: true
          type: string
        tagComment:
          nullable: true
          type: string
        tagComposer:
          example: Terry Goodkind
          nullable: true
          type: string
        tagDate:
          nullable: true
          type: string
        tagDescription:
          nullable: true
          type: string
        tagDisc:
          nullable: true
          type: string
        tagEncodedBy:
          nullable: true
          type: string
        tagEncoder:
          nullable: true
          type: string
        tagGenre:
          example: Audiobook Fantasy
          nullable: true
          type: string
        tagISRC:
          nullable: true
          type: string
        tagIsbn:
          nullable: true
          type: string
        tagLanguage:
          nullable: true
          type: string
        tagMusicBrainzAlbumArtistId:
          nullable: true
          type: string
        tagMusicBrainzAlbumId:
          nullable: true
          type: string
        tagMusicBrainzArtistId:
          nullable: true
          type: string
        tagMusicBrainzTrackId:
          nullable: true
          type: string
        tagOriginalYear:
          nullable: true
          type: string
        tagOverdriveMediaMarker:
          nullable: true
          type: string
        tagPublisher:
          nullable: true
          type: string
        tagReleaseCountry:
          nullable: true
          type: string
        tagReleaseStatus:
          nullable: true
          type: string
        tagReleaseType:
          nullable: true
          type: string
        tagSeries:
          nullable: true
          type: string
        tagSeriesPart:
          nullable: true
          type: string
        tagSubtitle:
          nullable: true
          type: string
        tagTitle:
          example: Wizards First Rule 01
          nullable: true
          type: string
        tagTrack:
          example: 01/20
          nullable: true
          type: string
      type: object
    AudioTrack:
      description: Represents an audio track with various properties.
      properties:
        codec:
          description: The codec used for the audio track.
          example: aac
          nullable: true
          type: string
        contentUrl:
          description: The URL where the audio track content is located.
          example: '`/api/items/${itemId}/file/${audioFile.ino}`'
          nullable: true
          type: string
        duration:
          description: The duration of the audio track in seconds.
          example: None
          format: float
          nullable: true
          type: number
        index:
          description: The index of the audio track.
          example: None
          nullable: true
          type: integer
        metadata: *id001
        mimeType:
          description: The MIME type of the audio track.
          example: None
          nullable: true
          type: string
        startOffset:
          description: The start offset of the audio track in seconds.
          example: None
          format: float
          nullable: true
          type: number
        title:
          description: The title of the audio track.
          example: None
          nullable: true
          type: string
      type: object
    AuthSettings:
      properties:
        authActiveAuthMethods:
          items:
            type: string
          nullable: true
          type: array
        authLoginCustomMessage:
          nullable: true
          type: string
        authOpenIDAdvancedPermsClaim:
          nullable: true
          type: string
        authOpenIDAuthorizationURL:
          nullable: true
          type: string
        authOpenIDAutoLaunch:
          nullable: true
          type: boolean
        authOpenIDAutoRegister:
          nullable: true
          type: boolean
        authOpenIDButtonText:
          nullable: true
          type: string
        authOpenIDClientID:
          nullable: true
          type: string
        authOpenIDClientSecret:
          nullable: true
          type: string
        authOpenIDGroupClaim:
          nullable: true
          type: string
        authOpenIDIssuerURL:
          nullable: true
          type: string
        authOpenIDJwksURL:
          nullable: true
          type: string
        authOpenIDLogoutURL:
          nullable: true
          type: string
        authOpenIDMatchExistingBy:
          nullable: true
          type: string
        authOpenIDMobileRedirectURIs:
          items:
            type: string
          nullable: true
          type: array
        authOpenIDSamplePermissions:
          nullable: true
          type: string
        authOpenIDTokenSigningAlgorithm:
          nullable: true
          type: string
        authOpenIDTokenURL:
          nullable: true
          type: string
        authOpenIDUserInfoURL:
          nullable: true
          type: string
      type: object
    Backup:
      properties:
        backupDirPath:
          description: The backup directory path.
          type: string
        createdAt: *id002
        datePretty:
          description: The date and time when the backup was created in a human-readable
            format.
          type: string
        fileSize:
          description: The size (in bytes) of the backup file.
          type: integer
        filename:
          description: The filename of the backup.
          type: string
        fullPath:
          description: The full path of the backup on the server.
          type: string
        id:
          description: The ID of the backup. Will be the date and time when the backup
            was created.
          type: string
        key:
          description: The type of backup (e.g. sqlite)
          nullable: true
          type: string
        path:
          description: The path of the backup relative to the metadata directory.
          type: string
        serverVersion:
          description: The version of the server when the backup was created.
          type: string
      required:
      - id
      - createdAt
      - fileSize
      - filename
      - path
      - fullPath
      - datePretty
      - backupDirPath
      - serverVersion
      - key
      type: object
    BookChapter:
      description: A book chapter. Includes the title and timestamps.
      properties:
        end:
          description: When in the book (in seconds) the chapter ends.
          example: '6004.6675'
          type: number
        id:
          description: The ID of the book chapter.
          type: number
        start:
          description: When in the book (in seconds) the chapter starts.
          type: number
        title:
          description: The title of the chapter.
          example: Wizards First Rule 01 Chapter 1
          type: string
      type: object
    BookMedia:
      properties:
        audioFiles:
          items: &id023
            $ref: '#/components/schemas/AudioFile'
          type: array
        chapters:
          items: *id003
          type: array
        coverPath: &id005
          $ref: '#/components/schemas/bookCoverPath'
        ebookFile:
          nullable: true
          type: string
        id:
          type: string
        libraryItemId: *id004
        metadata: &id009
          $ref: '#/components/schemas/BookMetadata'
        tags:
          items:
            description: Tags
            type: string
          type: array
      type: object
    BookMetadata:
      properties:
        abridged:
          description: Whether the book has been marked as abridged.
          type: boolean
        asin:
          description: The ASIN of the book. Will be null if unknown.
          nullable: true
          type: string
        authors:
          items: &id012
            $ref: '#/components/schemas/author'
          type: array
        description:
          description: The ISBN of the book. Will be null if unknown.
          nullable: true
          type: string
        explicit:
          description: Whether the book has been marked as explicit.
          type: boolean
        genres:
          items:
            description: genres
            type: string
          type: array
        isbn:
          description: String or null
          nullable: true
          type: string
        language:
          description: The language of the book. Will be null if unknown.
          nullable: true
          type: string
        narrators:
          items:
            description: narrators
            type: string
          type: array
        publishedDate:
          description: The date the book was published. Will be null if unknown.
          nullable: true
          type: string
        publishedYear:
          description: The year the book was published. Will be null if unknown.
          nullable: true
          type: string
        publisher:
          description: The publisher of the book. Will be null if unknown.
          nullable: true
          type: string
        series:
          items:
            $ref: '#/components/schemas/SeriesSequence'
          type: array
        subtitle:
          description: The subtitle of the book. Will be null if there is no subtitle.
          nullable: true
          type: string
        title:
          description: The title of the book. Will be null if unknown.
          nullable: true
          type: string
      type: object
    BookMetadataBase:
      description: The base book metadata object for minified, normal, and extended
        schemas to inherit from.
      properties:
        asin:
          description: The ASIN of the book. Will be null if unknown.
          example: B002V0QK4C
          nullable: true
          type: string
        description:
          description: A description for the book. Will be null if empty.
          example: The masterpiece that started Terry Goodkind's New York Times bestselling
            epic Sword of Truth In the aftermath of the brutal murder of his father,
            a mysterious woman, Kahlan Amnell, appears in Richard Cypher's forest
            sanctuary seeking help...and more. His world, his very beliefs, are shattered
            when ancient debts come due with thundering violence. In a dark age it
            takes courage to live, and more than mere courage to challenge those who
            hold dominion, Richard and Kahlan must take up that challenge or become
            the next victims. Beyond awaits a bewitching land where even the best
            of their hearts could betray them. Yet, Richard fears nothing so much
            as what secrets his sword might reveal about his own soul. Falling in
            love would destroy them - for reasons Richard can't imagine and Kahlan
            dare not say. In their darkest hour, hunted relentlessly, tormented by
            treachery and loss, Kahlan calls upon Richard to reach beyond his sword
            - to invoke within himself something more noble. Neither knows that the
            rules of battle have just changed...or that their time has run out. Wizard's
            First Rule is the beginning. One book. One Rule. Witness the birth of
            a legend.
          nullable: true
          type: string
        explicit:
          description: Whether the book has been marked as explicit.
          example: 'False'
          type: boolean
        genres:
          description: The genres of the book.
          example: '[''Fantasy'', ''Sci-Fi'', ''Nonfiction: History'']'
          items:
            type: string
          type: array
        isbn:
          description: The ISBN of the book. Will be null if unknown.
          nullable: true
          type: string
        language:
          description: The language of the book. Will be null if unknown.
          nullable: true
          type: string
        publishedDate:
          description: The date the book was published. Will be null if unknown.
          nullable: true
          type: string
        publishedYear:
          description: The year the book was published. Will be null if unknown.
          example: '2008'
          nullable: true
          type: string
        publisher:
          description: The publisher of the book. Will be null if unknown.
          example: Brilliance Audio
          nullable: true
          type: string
        subtitle:
          description: The subtitle of the book. Will be null if there is no subtitle.
          nullable: true
          type: string
        title:
          description: The title of the book. Will be null if unknown.
          example: Wizards First Rule
          nullable: true
          type: string
      type: object
    BookMetadataMinified:
      allOf:
      - $ref: '#/components/schemas/BookMetadataBase'
      - properties:
          authorName:
            description: The name of the book's author(s).
            example: Terry Goodkind
            type: string
          authorNameLF:
            description: The name of the book's author(s) with last names first.
            example: Goodkind, Terry
            type: string
          narratorName:
            description: The name of the audiobook's narrator(s).
            example: Sam Tsoutsouvas
            type: string
          seriesName:
            description: The name of the book's series.
            example: Sword of Truth
            type: string
          titleIgnorePrefix:
            description: The title of the book with any prefix moved to the end.
            type: string
        type: object
      description: The minified metadata for a book in the database.
    BookMinified:
      description: Minified book schema. Does not depend on `bookBase` because there's
        pretty much no overlap.
      properties:
        coverPath: *id005
        duration: *id006
        ebookFormat:
          description: The format of ebook of the book. Will be null if the book is
            an audiobook.
          nullable: true
          type: string
        metadata:
          $ref: '#/components/schemas/BookMetadataMinified'
        numAudioFiles:
          description: The number of audio files the book has.
          example: '1'
          type: integer
        numChapters:
          description: The number of chapters the book has.
          example: '1'
          type: integer
        numInvalidAudioFiles:
          description: The number of invalid audio files the book has.
          example: '0'
          type: integer
        numMissingParts:
          description: The total number of missing parts the book has.
          example: '0'
          type: integer
        numTracks:
          description: The number of tracks the book's audio files have.
          example: '1'
          type: integer
        size: &id026
          $ref: '#/components/schemas/size'
        tags: &id028
          $ref: '#/components/schemas/tags'
      type: object
    Chapter:
      properties:
        startTime:
          format: float
          type: number
        title:
          type: string
      type: object
    CollectionBase:
      properties:
        books:
          items: &id020
            $ref: '#/components/schemas/LibraryItemBase'
          type: array
        cover: *id005
        coverFullPath: *id005
        createdAt: *id002
        description:
          nullable: true
          type: string
        id:
          $ref: '#/components/schemas/collectionId'
        lastUpdate: *id007
        libraryId: &id013
          $ref: '#/components/schemas/libraryId'
        name:
          type: string
        userId: &id008
          $ref: '#/components/schemas/userid'
      type: object
    DeviceInfo:
      properties:
        browserName:
          description: The name of the browser
          nullable: true
          type: string
        browserVersion:
          description: The Version of the browser
          nullable: true
          type: string
        clientName:
          description: The name of the client.
          nullable: true
          type: string
        clientVersion:
          description: The version of the client.
          nullable: true
          type: string
        deviceId:
          description: The client device identifier.
          nullable: true
          type: string
        deviceName:
          description: The name of the users device
          nullable: true
          type: string
        deviceType:
          description: The type of the device (e.g. mobile)
          nullable: true
          type: string
        id:
          description: The id of this info
          type: string
        ipAddress:
          description: The ipAddress of the user
          nullable: true
          type: string
        manufacturer:
          description: The manufacturer of the client device.
          nullable: true
          type: string
        model:
          description: The model of the client device.
          nullable: true
          type: string
        osName:
          description: The name of the OS the user uses
          nullable: true
          type: string
        osVersion:
          description: The specified OS Version
          nullable: true
          type: string
        sdkVersion:
          description: For an Android client, the Android SDK version of the client.
          nullable: true
          type: integer
        userId: *id008
      type: object
    Directory:
      properties:
        dirname:
          description: The name of the directory.
          type: string
        dirs:
          description: The directories contained in this directory.
          items: &id054
            $ref: '#/components/schemas/Directory'
          type: array
        fullPath:
          description: The full path of the directory.
          nullable: true
          type: string
        level:
          description: The depth of the directory. 0 means a root level directory.
          type: integer
        path:
          description: The path of the directory.
          type: string
      required:
      - path
      - dirname
      - level
      type: object
    EmailSettings:
      description: The email settings configuration for the server. This includes
        the credentials to send e-books and an array of e-reader devices.
      properties:
        ereaderDevices:
          description: List of configured e-reader devices.
          items: &id033
            $ref: '#/components/schemas/EreaderDeviceObject'
          type: array
        fromAddress:
          description: The default "from" email address for outgoing emails.
          nullable: true
          type: string
        host:
          description: The SMTP host address.
          nullable: true
          type: string
        id:
          description: The unique identifier for the email settings. Currently this
            is always `email-settings`
          example: email-settings
          type: string
        pass:
          description: The password for SMTP authentication.
          nullable: true
          type: string
        port:
          description: The port number for the SMTP server.
          example: '465'
          format: int32
          type: integer
        rejectUnauthorized:
          description: Indicates if unauthorized SSL/TLS certificates should be rejected.
          example: 'True'
          type: boolean
        secure:
          description: Indicates if the connection should use SSL/TLS.
          example: 'True'
          type: boolean
        testAddress:
          description: The test email address used for sending test emails.
          nullable: true
          type: string
        user:
          description: The username for SMTP authentication.
          nullable: true
          type: string
      required:
      - id
      - port
      - secure
      - ereaderDevices
      type: object
    EreaderDeviceObject:
      description: An e-reader device configured to receive EPUB through e-mail.
      properties:
        availabilityOption:
          description: The availability option for the device.
          enum:
          - adminOrUp
          - userOrUp
          - guestOrUp
          - specificUsers
          type: string
        email:
          description: The email address associated with the e-reader device.
          type: string
        name: &id050
          $ref: '#/components/schemas/ereaderName'
        users:
          description: List of specific users allowed to access the device.
          items:
            type: string
          type: array
      required:
      - name
      - email
      - availabilityOption
      type: object
    ItemListenedTo:
      properties:
        id:
          description: The ID of the library item.
          type: string
        mediaMetadata: *id009
        timeListening:
          description: Time (in seconds) the user listened to the library item.
          type: number
      type: object
    LibraryFile:
      properties:
        addedAt: *id010
        fileType:
          description: The type of file that the library file is (audio, image, etc.).
          type: string
        ino: *id011
        isSupplementary:
          nullable: true
          type: boolean
        metadata: *id001
        updatedAt: *id007
      required:
      - fileType
      - addedAt
      - ino
      - updatedAt
      type: object
    LibraryFilterData:
      properties:
        authorCount:
          type: integer
        authors:
          description: The authors of books in the library.
          items: *id012
          type: array
        bookCount:
          type: integer
        genres:
          description: The genres of books in the library.
          items:
            type: string
          type: array
        languages:
          description: The languages of books in the library.
          items:
            type: string
          type: array
        loadedAt: *id002
        narrators:
          description: The narrators of books in the library.
          items:
            type: string
          type: array
        numIssues:
          type: integer
        podcastCount:
          type: integer
        publishedDecades:
          items:
            type: string
          type: array
        publishers:
          items:
            type: string
          type: array
        series:
          description: The series in the library. The series will only have their
            id and name.
          items: &id037
            $ref: '#/components/schemas/series'
          type: array
        seriesCount:
          type: integer
        tags:
          description: The tags in the library.
          items:
            type: string
          type: array
      type: object
    LibraryItemBase:
      description: Base library item schema
      nullable: true
      properties:
        addedAt: *id010
        birthtimeMs:
          description: The time (in ms since POSIX epoch) when the library item was
            created on disk. Will be 0 if unknown.
          type: integer
        ctimeMs:
          description: The time (in ms since POSIX epoch) when the library item status
            was changed on disk.
          type: integer
        folderId: &id034
          $ref: '#/components/schemas/folderId'
        id: *id004
        ino: *id011
        isFile:
          description: Whether the library item is a single file in the root of the
            library folder.
          type: boolean
        isInvalid:
          description: Whether the library item was scanned and no longer has media
            files.
          type: boolean
        isMissing:
          description: Whether the library item was scanned and no longer exists.
          type: boolean
        lastScan:
          nullable: true
          type: integer
        libraryFiles:
          items:
            $ref: '#/components/schemas/LibraryFile'
          type: array
        libraryId: *id013
        media:
          $ref: '#/components/schemas/BookMedia'
        mediaType: &id015
          $ref: '#/components/schemas/mediaType'
        mtimeMs:
          description: The time (in ms since POSIX epoch) when the library item was
            last modified on disk.
          type: integer
        oldLibraryItemId:
          $ref: '#/components/schemas/oldLibraryItemId'
        path:
          description: The path of the library item on the server.
          type: string
        relPath:
          description: The path, relative to the library folder, of the library item.
          type: string
        scanVersion:
          nullable: true
          type: string
        updatedAt: *id007
      type: object
    ListeningStatistics:
      properties:
        dayOfWeek:
          additionalProperties:
            description: Total time (in seconds) listened on that day of the week.
            type: number
          description: Total time listened to library items on each day of the week.
          properties: {}
          type: object
        days:
          additionalProperties:
            description: Total time (in seconds) listened on that day (formatted as
              YYYY-MM-DD).
            type: number
          description: Total time listened to library items on each day.
          properties: {}
          type: object
        items:
          additionalProperties:
            $ref: '#/components/schemas/ItemListenedTo'
          description: Library items that the user has listened to.
          properties: {}
          type: object
        recentSessions:
          description: The 10 most recent playback sessions for the user.
          items: &id029
            $ref: '#/components/schemas/PlaybackSession'
          type: array
        today:
          description: Time (in seconds) the user has listened to library items today.
          type: number
        totalTime:
          description: The total time (in seconds) the user has listened to library
            items.
          type: number
      type: object
    MediaProgress:
      properties:
        coverPath:
