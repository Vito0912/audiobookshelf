        : 000000000,\n    \"title\": \"\",\n    \"author\": \"\",\n    \"description\"\
        : \"\",\n    \"publishedYear\": \"0000\",\n    \"genres\": [\n      \"\"\n\
        \    ],\n    \"cover\": \"\"\n  }\n]\n```\n\n>  Audible\n\n```json\n[\n  {\n\
        \    \"title\": \"\",\n    \"subtitle\": \"\",\n    \"author\": \"\",\n  \
        \  \"narrator\": \"\",\n    \"publisher\": \"\",\n    \"publishedYear\": \"\
        0000\",\n    \"description\": \"\",\n    \"cover\": \"\",\n    \"asin\": \"\
        \",\n    \"genres\": [\n      \"Literature & Fiction\"\n    ],\n    \"tags\"\
        : \"\",\n    \"series\": [\n      {\n        \"series\": \"\",\n        \"\
