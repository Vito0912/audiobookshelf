      - podcastEpisodeSchedule
      - buildNumber
      - authLoginCustomMessage
      - authActiveAuthMethods
      type: object
    ServerStatus:
      properties:
        app:
          description: The name of the app
          nullable: true
          type: string
        authFormData:
          properties:
            authLoginCustomMessage:
              nullable: true
              type: string
          type: object
        authMethods:
          description: Enabled Auth methods
          items:
            type: string
          nullable: true
          type: array
        isInit:
          description: Whether the server has been initialized.
          type: boolean
        language:
          description: The server's default language.
          nullable: true
          type: string
        serverVersion:
          description: The server's version.
          nullable: true
          type: string
      required:
      - isInit
      type: object
    User:
      properties:
        bookmarks:
          description: The user's bookmarks.
          items: &id091
            $ref: '#/components/schemas/AudioBookmark'
          type: array
        createdAt: *id002
        email:
          description: The users email
          nullable: true
          type: string
        hasOpenIDLink:
          description: If the user has an active OpenIDLink
          nullable: true
          type: boolean
        id: *id008
        isActive:
          description: Whether the user's account is active.
          type: boolean
        isLocked:
          description: Whether the user is disabled.
          nullable: true
          type: boolean
        itemTagsAccessible: *id028
        itemTagsSelected: *id028
        lastSeen:
          description: The time (in ms since POSIX epoch) when the user was last seen
            by the server. Will be null if the user has never logged in.
          nullable: true
          type: integer
        librariesAccessible:
          description: Libraries accessible to the user. Wil be empty if all are accessible
          items: *id013
          nullable: true
          type: array
        mediaProgress:
          items: &id092
            $ref: '#/components/schemas/MediaProgress'
          type: array
        permissions: &id093
          $ref: '#/components/schemas/UserPermissions'
        seriesHideFromContinueListening:
          description: List of hidden series (Series ID)
          items: &id032
            $ref: '#/components/schemas/seriesId'
          type: array
        token:
          description: The atuh token of the user
          nullable: true
          type: string
        type:
          description: The type of the user
          enum:
          - root
          - guest
          - user
          - admin
          type: string
        username: &id030
          $ref: '#/components/schemas/username'
      required:
      - permissions
      - createdAt
      - isActive
      type: object
    UserPermissions:
      properties:
        accessAllLibraries:
          description: Whether the user can access all libraries.
          type: boolean
        accessAllTags:
          description: Whether the user can access all tags.
          type: boolean
        accessExplicitContent:
          description: Whether the user can access explicit content.
          type: boolean
        createEreader:
          description: Whether the user can create ereaders
          type: boolean
        delete:
          description: Whether the user can delete library items.
          type: boolean
        download:
          description: Whether the user can download items to the server.
          type: boolean
        selectedTagsNotAccessible:
          type: boolean
        update:
          description: Whether the user can update library items.
          type: boolean
        upload:
          description: Whether the user can upload items to the server.
          type: boolean
      type: object
    UserWithSession:
      properties:
        connections:
          nullable: true
          type: integer
        createdAt: *id002
        id: *id008
        lastSeen:
          $ref: '#/components/schemas/lastSeen'
        session: *id029
        type: &id094
          $ref: '#/components/schemas/userType'
        username: *id030
      required:
      - id
      - username
      - type
      type: object
    addedAt:
      description: The time (in ms since POSIX epoch) when added to the server.
      example: '1633522963509'
      type: integer
    appriseApiUrl:
      description: The full URL where the Apprise API to use is located.
      nullable: true
      type: string
    author:
      description: An author object which includes a description and image path. The
        library items and series associated with the author are optionally included.
      properties:
        addedAt: *id010
        asin: &id039
          $ref: '#/components/schemas/authorAsin'
        description: &id040
          $ref: '#/components/schemas/authorDescription'
        id: &id075
          $ref: '#/components/schemas/authorId'
        imagePath: &id041
          $ref: '#/components/schemas/authorImagePath'
        libraryId: *id031
        libraryItems:
          description: The items associated with the author
          items: *id018
          type: array
        name: &id042
          $ref: '#/components/schemas/authorName'
        series:
          description: The series associated with the author
          items:
            $ref: '#/components/schemas/authorSeries'
          type: array
        updatedAt: *id007
      type: object
    authorAsin:
      description: The Audible identifier (ASIN) of the author. Will be null if unknown.
        Not the Amazon identifier.
      example: B000APZOQA
      nullable: true
      type: string
    authorDescription:
      description: The new description of the author.
      example: Terry Goodkind is a
      nullable: true
      type: string
    authorExpanded:
      allOf:
      - *id012
      - properties:
          numBooks:
            description: The number of books associated with the author in the library.
            example: '1'
            type: integer
        type: object
      description: The author schema with the total number of books in the library.
    authorISBN:
      description: The ISBN
      nullable: true
      type: string
    authorId:
      description: The ID of the author.
      example: e4bb1afb-4a4f-4dd6-8be0-e615d233185b
      format: uuid
      type: string
    authorImagePath:
      description: The absolute path for the author image. This will be in the `metadata/`
        directory. Will be null if there is no image.
      example: /metadata/authors/aut_z3leimgybl7uf3y4ab.jpg
      nullable: true
      type: string
    authorMerged:
      description: Whether the author was merged with another author. Will not exist
        if author was updated.
      nullable: true
      type: boolean
    authorName:
      description: The name of the author.
      example: Terry Goodkind
      type: string
    authorSearchName:
      description: The name of the author to use for searching.
      example: Terry Goodkind
      type: string
    authorSeries:
      description: Series and the included library items that an author has written.
      properties:
        id: *id032
        items:
          description: The items in the series. Each library item's media's metadata
            will have a `series` attribute, a `Series Sequence`, which is the matching
            series.
          items: *id018
          type: array
        name: &id036
          $ref: '#/components/schemas/seriesName'
      type: object
    authorUpdated:
      description: Whether the author was updated without errors. Will not exist if
        author was merged.
      nullable: true
      type: boolean
    autoDownloadEpisodes:
      description: Whether episodes are automatically downloaded.
      type: boolean
    binaryTrue:
      description: 0 = False; 1 = True
      maximum: 1
      minimum: 0
      type: integer
    bodyTemplate:
      description: The template for the notification body.
      example: '{{episodeTitle}} has been added to {{libraryName}} library.'
      type: string
    bookCoverPath:
      description: The absolute path on the server of the cover file. Will be null
        if there is no cover.
      example: /audiobooks/Terry Goodkind/Sword of Truth/Wizards First Rule/cover.jpg
      nullable: true
      type: string
    collapseSeries:
      description: Whether collapse series was set in the request.
      example: 'True'
      type: boolean
    collectionId:
      description: The ID of the collection
      format: uuid
      type: string
    createdAt:
      description: The time (in ms since POSIX epoch) when was created.
      example: '1633522963509'
      type: integer
    durationSec:
      description: The total length (in seconds) of the item or file.
      example: '33854.905'
      type: number
    durationString:
      description: Duration as a string. `00:52:31`
      type: string
    email200: &id051
      $ref: '#/components/schemas/EmailSettings'
    enabled:
      default: false
      description: Whether the notification is enabled.
      type: boolean
    episodeId:
      description: The ID of the podcast episode.
      format: uuid
      nullable: true
      type: string
    ereader200:
      properties:
        ereaderDevices:
          items: *id033
          type: array
      type: object
    ereaderName:
      description: The name of the e-reader device.
      type: string
    fileMetadata:
      description: The metadata for a file, including the path, size, and unix timestamps
        of the file.
      nullable: true
      properties:
        birthtimeMs:
          description: The time (in ms since POSIX epoch) when the file was created
            on disk. Will be 0 if unknown.
          example: '0'
          type: integer
        ctimeMs:
          description: The time (in ms since POSIX epoch) when the file status was
            changed on disk.
          example: '1645978261001'
          type: integer
        ext:
          description: The file extension of the file.
          example: .mp3
          type: string
        filename:
          description: The filename of the file.
          example: Wizards First Rule 01.mp3
          type: string
        mtimeMs:
          description: The time (in ms since POSIX epoch) when the file was last modified
            on disk.
          example: '1632223180278'
          type: integer
        path:
          description: The absolute path on the server of the file.
          example: /audiobooks/Terry Goodkind/Sword of Truth/Wizards First Rule/Terry
            Goodkind - SOT Bk01 - Wizards First Rule 01.mp3
          type: string
        relPath:
          description: The path of the file, relative to the book's or podcast's folder.
          example: Wizards First Rule 01.mp3
          type: string
        size: *id026
      type: object
    filterBy:
      description: The field to filter by from the request. TODO
      example: media.metadata.title
      type: string
    folder:
      description: Folder used in library
      properties:
        addedAt: *id010
        fullPath:
          description: The path on the server for the folder. (Read Only)
          example: /podcasts
          type: string
        id: *id034
        libraryId: *id013
      type: object
    folderId:
      description: The ID of the folder.
      example: e4bb1afb-4a4f-4dd6-8be0-e615d233185b
      format: uuid
      type: string
    genres:
      items:
        type: string
      nullable: true
      type: array
    imageFormat:
      default: jpeg
      description: The requested output format.
      example: webp
      type: string
    imageHeight:
      default: null
      description: The requested height of image in pixels. If `null`, the height
        is scaled to maintain aspect ratio based on the requested width.
      example: '600'
      nullable: true
      type: integer
    imageRaw:
      default: false
      description: Return the raw image without scaling if true.
      type: boolean
    imageUrl:
      description: The URL of the image to add to the server
      example: https://images-na.ssl-images-amazon.com/images/I/51NoQTm33OL.__01_SX120_CR0,0,120,120__.jpg
      format: uri
      type: string
    imageWidth:
      default: 400
      description: The requested width of image in pixels.
      example: '400'
      type: integer
    inode:
      description: The inode of the item in the file system.
      example: '649644248522215260'
      format: '[0-9]*'
      type: string
    lastSeen:
      description: The time this item was last seen (e.g. online)
      nullable: true
      type: integer
    library:
      description: A library object which includes either books or podcasts.
      properties:
        createdAt: *id002
        displayOrder:
          description: Display position of the library in the list of libraries. Must
            be >= 1.
          example: '1'
          type: integer
        folders:
          description: The folders that belong to the library.
          items: &id035
            $ref: '#/components/schemas/folder'
          type: array
        icon:
          description: The selected icon for the library. See Library Icons for a
            list of possible icons.
          example: audiobookshelf
          type: string
        id: *id013
        lastScan: *id014
        lastScanVersion:
          description: The server's version
          nullable: true
          type: string
        lastUpdate: *id007
        mediaType:
          description: The type of media that the library contains. Will be `book`
            or `podcast`. (Read Only)
          example: book
          type: string
        name: &id059
          $ref: '#/components/schemas/libraryName'
        provider:
          description: Preferred metadata provider for the library. See Metadata Providers
            for a list of possible providers.
          example: audible
          type: string
        settings: &id061
          $ref: '#/components/schemas/librarySettings'
      type: object
    library200: &id058
      $ref: '#/components/schemas/library'
    libraryDisplayOrder:
      description: The display order of the library. Must be >= 1.
      example: '1'
      minimum: 1
      type: integer
    libraryFolders:
      description: The folders of the library. Only specify the fullPath.
      items: *id035
      type: array
    libraryIcon:
      description: The icon of the library. See Library Icons for a list of possible
        icons.
      example: audiobookshelf
      type: string
    libraryId:
      description: The ID of the library.
      example: e4bb1afb-4a4f-4dd6-8be0-e615d233185b
      format: uuid
      type: string
    libraryIdNullable:
      description: The ID of the library. Applies to all libraries if `null`.
      example: e4bb1afb-4a4f-4dd6-8be0-e615d233185b
      format: uuid
      nullable: true
      type: string
    libraryInclude:
      description: The fields to include in the response. The only current option
        is `rssfeed`.
      example: rssfeed
      type: string
    libraryItemId:
      description: The ID of library items after 2.3.0.
      example: e4bb1afb-4a4f-4dd6-8be0-e615d233185b
      format: uuid
      type: string
    libraryItemMinified:
      allOf:
      - *id020
      - description: ''
        properties:
          media:
            $ref: '#/components/schemas/mediaMinified'
          numFiles:
            description: The number of files
            type: integer
          size: *id026
        required:
        - size
        - numFiles
        title: ''
        type: object
      description: A single item on the server, like a book or podcast. Minified media
        format.
    libraryItemSequence:
      allOf:
      - *id018
      - properties:
          sequence:
            $ref: '#/components/schemas/sequence'
        type: object
      description: A single item on the server, like a book or podcast. Includes series
        sequence information.
    libraryMediaType:
      description: The type of media that the library contains. Must be `book` or
        `podcast`.
      example: book
      type: string
    libraryName:
      description: The name of the library.
      example: My Audiobooks
      type: string
    libraryProvider:
      description: The metadata provider to search.
      enum:
      - google
      - openlibrary
      - itunes
      - audible
      - audible.ca
      - audible.uk
      - audible.au
      - audible.fr
      - audible.de
      - audible.jp
      - audible.it
      - audible.in
      - audible.es
      - fantlab
      type: string
    librarySettings:
      description: The settings for the library.
      properties:
        audiobooksOnly:
          description: Whether the library should ignore ebook files and only allow
            ebook files to be supplementary.
          example: 'False'
          type: boolean
        autoScanCronExpression:
          description: The cron expression for when to automatically scan the library
            folders. If null, automatic scanning will be disabled.
          example: 0 0 0 * * *
          nullable: true
          type: string
        coverAspectRatio:
          description: Whether the library should use square book covers. Must be
            0 (for false) or 1 (for true).
          example: '1'
          type: integer
        disableWatcher:
          description: Whether to disable the folder watcher for the library.
          example: 'False'
          type: boolean
        epubsAllowScriptedContent:
          description: If epubs in the library support scripting
          type: boolean
        hideSingleBookSeries:
          description: Whether to hide series with only one book.
          example: 'False'
          type: boolean
        markAsFinishedPercentComplete:
          description: The percentage of progress when a item is counted as finished
          nullable: true
          type: number
        markAsFinishedTimeRemaining:
          description: The time of progress when a item is counted as finished
          nullable: true
          type: number
        metadataPrecedence:
          description: The precedence of metadata sources. See Metadata Providers
            for a list of possible providers.
          example: '[''folderStructure'', ''audioMetatags'', ''nfoFile'', ''txtFiles'',
            ''opfFile'', ''absMetadata'']'
          items:
            type: string
          type: array
        onlyShowLaterBooksInContinueSeries:
          description: Whether to only show books in a series after the highest series
            sequence.
          example: 'False'
          type: boolean
        podcastSearchRegion:
          description: The region to use when searching for podcasts.
          example: us
          type: string
        skipMatchingMediaWithAsin:
          description: Whether to skip matching books that already have an ASIN.
          example: 'False'
          type: boolean
        skipMatchingMediaWithIsbn:
          description: Whether to skip matching books that already have an ISBN.
          example: 'False'
          type: boolean
      type: object
    limit:
      default: 0
      description: The number of items to return. If 0, no items are returned.
      example: '10'
      type: integer
    login200:
      properties:
        Source:
          description: The server's installation source.
          nullable: true
          type: string
        ereaderDevices:
          items:
            type: string
          type: array
        serverSettings: &id038
          $ref: '#/components/schemas/ServerSettings'
        user: &id090
          $ref: '#/components/schemas/User'
        userDefaultLibraryId: *id013
      required:
      - user
      - serverSettings
      - ereaderDevices
      type: object
    maxFailedAttempts:
      default: 5
      description: The maximum number of times a notification fails before being disabled.
      minimum: 0
      type: integer
    maxNotificationQueue:
      description: The maximum number of notifications in the notification queue before
        events are ignored.
      type: integer
    mediaMinified:
      description: The minified media of the library item.
      oneOf:
      - $ref: '#/components/schemas/BookMinified'
    mediaType:
      description: The type of media, will be book or podcast.
      enum:
      - book
      - podcast
      type: string
    mimeTypes:
      description: The MIME types that are supported by the client. If the MIME type
        of the audio file is not in this list, the server will transcode it.
      enum:
      - audio/aac
      - audio/midi
      - audio/x-midi
      - audio/mpeg
      - audio/ogg
      - audio/wav
      - audio/webm
      - audio/opus
      nullable: true
      type: string
    minified:
      default: false
      description: Return minified items if true.
      example: 'True'
      type: boolean
    notificationEventName:
      description: The name of the event the notification will fire on.
      enum:
      - onPodcastEpisodeDownloaded
      - onBackupCompleted
      - onBackupFailed
      - onTest
      type: string
    notificationId:
      description: The ID of the notification.
      example: notification-settings
      type: string
    notificationType:
      default: info
      description: The notification's type.
      enum:
      - info
      - success
      - warning
      - failure
      nullable: true
      type: string
    numItemsUpdated:
      description: The number of items affacted by this change
      nullable: true
      type: integer
    offset:
      description: The offset of a given request
      type: integer
    oldLibraryItemId:
      description: The ID of library items on server version 2.2.23 and before.
      example: li_o78uaoeuh78h6aoeif
      format: li_[a-z0-9]{18}
      nullable: true
      type: string
    oldPodcastId:
      description: The ID of podcasts on server version 2.2.23 and before.
      example: pod_o78uaoeuh78h6aoeif
      format: pod_[a-z0-9]{18}
      nullable: true
      type: string
    page:
      default: 0
      description: The page number (zero indexed) to return. If no limit is specified,
        then page will have no effect.
      example: '1'
      type: integer
    playMethod:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      maximum: 4
      minimum: 0
      nullable: true
      type: integer
    podcastId:
      description: The ID of podcasts and podcast episodes after 2.3.0.
      example: e4bb1afb-4a4f-4dd6-8be0-e615d233185b
      format: uuid
      type: string
    progressId:
      description: The ID of the media progress. If the media progress is for a book,
        this will just be the libraryItemId. If for a podcast episode, it will be
        a hyphenated combination of the libraryItemId and episodeId.
      type: string
    region:
      default: us
      description: The region used to search.
      example: us
      type: string
    sequence:
      description: The position in the series the book is.
      nullable: true
      type: string
    series:
      description: A series object which includes the name and description of the
        series.
      properties:
        addedAt: *id010
        description: &id089
          $ref: '#/components/schemas/seriesDescription'
        id: *id032
        libraryId: *id013
        name: *id036
        nameIgnorePrefix: *id036
        updatedAt: *id007
      type: object
    seriesBooks:
      description: A series object which includes the name and books in the series.
      properties:
        addedAt: *id010
        books:
          description: The library items that contain the books in the series. A sequence
            attribute that denotes the position in the series the book is in, is tacked
            on.
          items:
            $ref: '#/components/schemas/libraryItemSequence'
          type: array
        description:
          description: The description of the book
          nullable: true
          type: string
        id: *id032
        libraryId: *id013
        name: *id036
        nameIgnorePrefix:
          description: The name of the series with any prefix moved to the end.
          type: string
        nameIgnorePrefixSort:
          description: The name of the series with any prefix removed.
          type: string
        totalDuration:
          description: The combined duration (in seconds) of all books in the series.
          type: number
        type:
          description: Will always be `series`.
          type: string
        updatedAt: *id007
      required:
      - libraryId
      type: object
    seriesDescription:
      description: A description for the series. Will be null if there is none.
      example: The Sword of Truth is a series of twenty one epic fantasy novels written
        by Terry Goodkind.
      nullable: true
      type: string
    seriesId:
      description: The ID of the series.
      example: e4bb1afb-4a4f-4dd6-8be0-e615d233185b
      format: uuid
      type: string
    seriesName:
      description: The name of the series.
      example: Sword of Truth
      type: string
    seriesProgress:
      description: The user's progress of a series.
      properties:
        isFinished:
          description: Whether the series is finished.
          type: boolean
        libraryItemIds:
          description: The IDs of the library items in the series.
          items: *id004
          type: array
        libraryItemIdsFinished:
          description: The IDs of the library items in the series that are finished.
          items: *id004
          type: array
      type: object
    seriesWithProgressAndRSS:
      description: A series object which includes the name and progress of the series.
      oneOf:
      - *id037
      - properties:
          progress:
            $ref: '#/components/schemas/seriesProgress'
          rssFeed:
            description: The RSS feed for the series.
            example: TBD
            type: string
        type: object
    size:
      description: The total size (in bytes) of the item or file.
      example: '268824228'
      type: integer
    socketId:
      description: The ID of the connected socket.
      type: string
    sortBy:
      description: The field to sort by from the request.
      example: media.metadata.title
      type: string
    sortDesc:
      description: Whether to sort in descending order.
      example: 'True'
      type: boolean
    tags:
      description: Tags applied to items.
      example: '[''To Be Read'', ''Genre: Nonfiction'']'
      items:
        description: Name of the tags
        type: string
      type: array
    timeSincePOSIX:
      description: The time (in ms since POSIX epoch) when the media was finished.
        Will be null if the media has is not finished.
      nullable: true
      type: integer
    titleTemplate:
      description: The template for the notification title.
      example: New {{podcastTitle}} Episode!
      type: string
    total:
      description: The total number of items in the response.
      example: '100'
      type: integer
    updatedAt:
      description: The time (in ms since POSIX epoch) when last updated.
      example: '1633522963509'
      type: integer
    urls:
      description: The Apprise URLs to use for the notification.
      example: http://192.168.0.3:8000/notify/my-cool-notification
      items:
        type: string
      type: array
    userType:
      enum:
      - guest
      - user
      - admin
      - root
      type: string
    userid:
      description: The ID of the user
      nullable: true
      type: string
    username:
      description: The username of the user
      type: string
    watcherType:
      enum:
      - add
      - unlink
      - rename
      type: string
  securitySchemes:
    bearer:
      scheme: bearer
      type: http
info:
  description: ''
  title: ABS-YAML
  version: 1.0.0
openapi: 3.0.1
paths:
  /api/auth-settings:
    get:
      deprecated: false
      description: ''
