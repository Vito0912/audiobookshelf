        : 0000,\n    \"region\": null,\n    \"rating\": \"\"\n  }\n]\n```\n\n\n> FantLab\n\
        \n```json\n[\n  {\n    \"id\": 0000,\n    \"title\": \"\",\n    \"subtitle\"\
        : null,\n    \"author\": \"\",\n    \"publisher\": null,\n    \"publishedYear\"\
        : 2000,\n    \"description\": \"\",\n    \"genres\": [\n      \"\"\n    ],\n\
