      type: object
      properties:
        id: *ref_34
        name: *ref_10
        folders:
          description: The folders that belong to the library.
          type: array
          items: *ref_54
        displayOrder:
          description: >-
            Display position of the library in the list of libraries. Must be >=
            1.
          type: integer
          examples:
            - 1
        icon:
          description: >-
            The selected icon for the library. See Library Icons for a list of
            possible icons.
          type: string
          examples:
            - audiobookshelf
        mediaType:
          description: >-
            The type of media that the library contains. Will be `book` or
            `podcast`. (Read Only)
          type: string
          examples:
            - book
        provider:
          description: >-
            Preferred metadata provider for the library. See Metadata Providers
            for a list of possible providers.
          type: string
          examples:
            - audible
        settings: *ref_16
        createdAt: *ref_40
        lastUpdate: *ref_51
    authorExpanded:
      description: The author schema with the total number of books in the library.
      allOf:
        - *ref_0
        - type: object
          properties:
            numBooks:
              description: The number of books associated with the author in the library.
              type: integer
              examples:
                - 1
    libraryItemSequence:
      description: >-
