      type: string
      description: The ID of podcasts and podcast episodes after 2.3.0.
      format: uuid
      examples:
        - e4bb1afb-4a4f-4dd6-8be0-e615d233185b
    maxFailedAttempts:
      type: integer
      minimum: 0
      default: 5
      description: The maximum number of times a notification fails before being disabled.
    notificationType:
      type:
        - string
        - 'null'
      enum:
        - info
        - success
        - warning
        - failure
      default: info
      description: The notification's type.
    enabled:
      type: boolean
      default: false
      description: Whether the notification is enabled.
    bodyTemplate:
      type: string
      description: The template for the notification body.
      examples:
        - '{{episodeTitle}} has been added to {{libraryName}} library.'
    titleTemplate:
      type: string
      description: The template for the notification title.
      examples:
        - New {{podcastTitle}} Episode!
    urls:
      type: array
      items:
        type: string
      description: The Apprise URLs to use for the notification.
      examples:
        - http://192.168.0.3:8000/notify/my-cool-notification
    notificationEventName:
      type: string
      description: The name of the event the notification will fire on.
      enum:
        - onPodcastEpisodeDownloaded
        - onBackupCompleted
        - onBackupFailed
        - onTest
    libraryIdNullable:
      type:
        - string
        - 'null'
      description: The ID of the library. Applies to all libraries if `null`.
      format: uuid
      examples:
        - e4bb1afb-4a4f-4dd6-8be0-e615d233185b
    appriseApiUrl:
      type:
        - string
        - 'null'
      description: The full URL where the Apprise API to use is located.
    notificationId:
      type: string
      description: The ID of the notification.
      examples:
        - notification-settings
    sequence:
      description: The position in the series the book is.
      type:
        - string
        - 'null'
    libraryInclude:
      description: >-
        The fields to include in the response. The only current option is
        `rssfeed`.
      type: string
      examples:
        - rssfeed
    collapseSeries:
      type: boolean
      description: Whether collapse series was set in the request.
      examples:
        - true
    minified:
      description: Return minified items if true.
      type: boolean
      default: false
      examples:
        - true
    filterBy:
      type: string
      description: The field to filter by from the request. TODO
      examples:
        - media.metadata.title
    sortBy:
      type: string
      description: The field to sort by from the request.
      examples:
        - media.metadata.title
    sortDesc:
      description: Whether to sort in descending order.
      type: boolean
      examples:
        - true
    seriesDescription:
      description: A description for the series. Will be null if there is none.
      type:
        - string
        - 'null'
      examples:
        - >-
          The Sword of Truth is a series of twenty one epic fantasy novels
          written by Terry Goodkind.
    page:
      description: >-
        The page number (zero indexed) to return. If no limit is specified, then
        page will have no effect.
      type: integer
      default: 0
      examples:
        - 1
    limit:
      description: The number of items to return. If 0, no items are returned.
      type: integer
      default: 0
      examples:
        - 10
    total:
      description: The total number of items in the response.
      type: integer
      examples:
        - 100
    libraryProvider:
      description: >-
        Preferred metadata provider for the library. See Metadata Providers for
        a list of possible providers.
      type: string
      examples:
        - audible
    libraryMediaType:
      description: >-
        The type of media that the library contains. Must be `book` or
        `podcast`.
      type: string
      examples:
        - book
    libraryIcon:
      description: The icon of the library. See Library Icons for a list of possible icons.
      type: string
      examples:
        - audiobookshelf
    libraryDisplayOrder:
      description: The display order of the library. Must be >= 1.
      type: integer
      minimum: 1
      examples:
        - 1
    libraryFolders:
      description: The folders of the library. Only specify the fullPath.
      type: array
      items: &ref_54
        $ref: '#/components/schemas/folder'
    createdAt:
      type: integer
      description: The time (in ms since POSIX epoch) when was created.
      examples:
        - 1633522963509
    libraryName:
      description: The name of the library.
      type: string
      examples:
        - My Audiobooks
    ereaderName:
      type: string
      description: The name of the e-reader device.
    region:
      description: The region used to search.
      type: string
      default: us
      examples:
        - us
    authorSearchName:
      description: The name of the author to use for searching.
      type: string
      examples:
        - Terry Goodkind
    imageUrl:
      description: The URL of the image to add to the server
      type: string
