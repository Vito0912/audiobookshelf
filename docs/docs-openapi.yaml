  /auth/openid:
    get:
      summary: OAuth2 Authorization Request
      deprecated: false
      description: >-
        This endpoint starts a standard OAuth2 flow with PKCE (required - S256;
        see RFC7636), to log the user in using SSO.


        For the code_challenge, you must randomly generate a minimum 32-byte
        string called verifier (PKCE challenge). With the verifier, you can then
        generate the challenge. See the examples on the right side.


        Also you must generate a random string and send it in the state
        parameter.


        On a valid request, it will return a 302-redirect (usually with a
        Location: header), which will point to the ABS-configured OAuth2
        Provider. It will include your generated state-parameter, check if it
        matches. You would usually then have to open this redirect-URL in a
        Browser to present to the user.


        Note that you will have to preserve the cookies you receive in this call
        for using it in /auth/openid/callback (check if you need to set a
        parameter for the HTTP library you are using for that).


        When the user has logged in (successfully) inside the Browser, the
        Browser will redirect to the URL redirect_uri which should be a URL your
        website or app can open (like a universal app link). The call to the
        redirect_uri will include state and code GET parameters. Check if the
        state parameter is the same as above and use the code for the call to
        /auth/openid/callback.
      operationId: oAuthRequest
      tags:
        - Server
        - Server
      parameters:
        - name: code_challenge
          in: query
          description: PKCE code_challenge you generated from verifier
          required: true
          schema:
            type: string
        - name: code_challenge_method
          in: query
          description: Must be S256
          required: true
          example: S256
          schema:
            type: string
        - name: response_type
          in: query
          description: Only code is supported
          required: true
          example: code
          schema:
            type: string
        - name: redirect_uri
          in: query
          description: >-
            URL where to redirect after a successful login. Must be whitelisted
            in ABS
          required: true
          schema:
            type: string
        - name: client_id
          in: query
          description: >-
            The name of your app (currently not used, but might be required at
            some point)
          required: true
          schema:
            type: string
        - name: state
          in: query
          description: A randomly generated string, which must match in subsequent requests
          required: true
          schema:
            type: string
      responses:
        '302':
          description: ''
          content:
            '*/*':
              schema:
                type: object
                properties: {}
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
          headers: {}
        '401':
          description: ''
          content:
            '*/*':
              schema:
                type: object
                properties: {}
          headers: {}
      security: []
  /auth/openid/callback:
    get:
      summary: OAuth2 Callback
      deprecated: false
      description: >-
        This API call finalizes the OAuth2 flow. The behavior of this call
        depends on whether a redirect_uri was provided in the /auth/openid
        request:

            If a redirect_uri was provided, this call returns user JSON data.
            If a redirect_uri was not provided, it will redirect to /login (used internally by ABS-web).

        It's important to note that the call to /auth/openid/callback is
        stateful. This means that the cookies set during the /auth/openid call
        must be sent along with this request.
      operationId: oAuthCallback
      tags:
        - Server
        - Server
      parameters:
        - name: state
          in: query
          description: The state string you generated in the first request
          required: true
          schema:
            type: string
        - name: code
          in: query
          description: The code you received when redirect_uri was called
          required: true
          schema:
            type: string
        - name: code_verifier
          in: query
          description: >-
            This is the verifier you generated when providing the code_challenge
            in the first request
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
          headers: {}
        '302':
          description: ''
          content:
            '*/*':
              schema:
                type: object
                properties: {}
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
          headers: {}
        '401':
          description: ''
          content:
            '*/*':
              schema:
                type: object
                properties: {}
          headers: {}
      security: []
  /auth/openid/mobile-redirect:
    get:
      summary: OAuth2 Mobile Redirect
      deprecated: false
      description: >-
        This is an internal endpoint, which should not be called directly by an
        application. It is intended purely for the redirection of SSO providers.


        When you provide a redirect_uri in /auth/openid, ABS performs an
        important operation: it saves your redirect_uri and instructs the SSO
        provider to use /auth/openid/mobile-redirect instead. This endpoint, in
        turn, redirects to your original redirect_uri.


        This mechanism allows ABS to provide a https callback URL, which is
        particularly useful for mobile apps.


        This call does not require a cookie or session. It matches the
        redirect_uri using the state parameter.
      operationId: oAuthCallback
      tags:
        - Server
        - Server
      parameters:
        - name: state
          in: query
          description: The state string you generated in the first request
          required: true
          schema:
            type: string
        - name: code
          in: query
          description: The code you received when redirect_uri was called
          required: true
          schema:
            type: string
      responses:
        '302':
          description: ''
          content:
            '*/*':
              schema:
                type: object
                properties: {}
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
          headers: {}
        '401':
          description: ''
          content:
            '*/*':
              schema:
                type: object
                properties: {}
          headers: {}
      security: []
