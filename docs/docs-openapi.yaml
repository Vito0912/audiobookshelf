          type:
            - string
            - 'null'
          description: The SMTP host address.
        port:
          type: integer
          format: int32
          description: The port number for the SMTP server.
          examples:
            - 465
        secure:
          type: boolean
          description: Indicates if the connection should use SSL/TLS.
          examples:
            - true
        rejectUnauthorized:
          type: boolean
          description: Indicates if unauthorized SSL/TLS certificates should be rejected.
          examples:
            - true
        user:
          type:
            - string
            - 'null'
          description: The username for SMTP authentication.
        pass:
          type:
            - string
            - 'null'
          description: The password for SMTP authentication.
        testAddress:
          type:
            - string
            - 'null'
          description: The test email address used for sending test emails.
        fromAddress:
          type:
            - string
            - 'null'
          description: The default "from" email address for outgoing emails.
        ereaderDevices:
          type: array
          description: List of configured e-reader devices.
          items: *ref_8
      required:
        - id
        - port
        - secure
        - ereaderDevices
    folder:
      type: object
      description: Folder used in library
      properties:
        id: *ref_42
        fullPath:
          description: The path on the server for the folder. (Read Only)
          type: string
          examples:
            - /podcasts
        libraryId: *ref_34
        addedAt: *ref_50
    librarySettings:
      description: The settings for the library.
      type: object
      properties:
        coverAspectRatio:
          description: >-
            Whether the library should use square book covers. Must be 0 (for
            false) or 1 (for true).
          type: integer
          examples:
            - 1
        disableWatcher:
          description: Whether to disable the folder watcher for the library.
          type: boolean
          examples:
            - false
        skipMatchingMediaWithAsin:
          description: Whether to skip matching books that already have an ASIN.
          type: boolean
          examples:
            - false
        skipMatchingMediaWithIsbn:
          description: Whether to skip matching books that already have an ISBN.
          type: boolean
          examples:
            - false
        autoScanCronExpression:
          description: >-
            The cron expression for when to automatically scan the library
            folders. If null, automatic scanning will be disabled.
          type:
            - string
            - 'null'
          examples:
            - 0 0 0 * * *
        audiobooksOnly:
          description: >-
            Whether the library should ignore ebook files and only allow ebook
            files to be supplementary.
          type: boolean
          examples:
            - false
        hideSingleBookSeries:
          description: Whether to hide series with only one book.
          type: boolean
          examples:
            - false
        onlyShowLaterBooksInContinueSeries:
          description: >-
            Whether to only show books in a series after the highest series
            sequence.
          type: boolean
          examples:
            - false
        metadataPrecedence:
          description: >-
            The precedence of metadata sources. See Metadata Providers for a
