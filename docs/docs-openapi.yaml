    authorAsin:
      description: >-
        The Audible identifier (ASIN) of the author. Will be null if unknown.
        Not the Amazon identifier.
      type:
        - string
        - 'null'
      examples:
        - B000APZOQA
    authorId:
      type: string
      description: The ID of the author.
      format: uuid
      examples:
        - e4bb1afb-4a4f-4dd6-8be0-e615d233185b
    durationString:
      type: string
      description: Duration as a string. `00:52:31`
    userid:
      type: string
      description: The ID of the user
    username:
      type: string
      description: The username of the user
    progressId:
      type: string
      description: >-
        The ID of the media progress. If the media progress is for a book, this
        will just be the libraryItemId. If for a podcast episode, it will be a
        hyphenated combination of the libraryItemId and episodeId.
    timeSincePOSIX:
      type: integer
      description: >-
        The time (in ms since POSIX epoch) when the media was finished. Will be
        null if the media has is not finished.
    episodeId:
      type: string
      format: uuid
      description: The ID of the podcast episode.
    socketId:
      type: string
      description: The ID of the connected socket.
    UserPermissions:
      type: object
      properties:
        download:
          type: boolean
          description: Whether the user can download items to the server.
        update:
          type: boolean
          description: Whether the user can update library items.
        delete:
          type: boolean
          description: Whether the user can delete library items.
        upload:
          type: boolean
          description: Whether the user can upload items to the server.
        accessAllLibraries:
          type: boolean
          description: Whether the user can access all libraries.
        accessAllTags:
          type: boolean
          description: Whether the user can access all tags.
        accessExplicitContent:
          type: boolean
          description: Whether the user can access explicit content.
        createEreader:
          type: boolean
          description: Whether the user can create ereaders
        selectedTagsNotAccessible:
          type: boolean
    User:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/userid'
        username: *ref_37
        email:
          type:
            - string
            - 'null'
          description: The users email
        type:
          type: string
          enum:
            - root
            - guest
            - user
            - admin
          description: The type of the user
        token:
          type:
            - string
            - 'null'
          description: The atuh token of the user
        mediaProgress:
          type: array
          items:
            $ref: '#/components/schemas/MediaProgress'
        seriesHideFromContinueListening:
          type: array
          items: &ref_45
            $ref: '#/components/schemas/seriesId'
          description: List of hidden series (Series ID)
        bookmarks:
          type: array
          items:
            $ref: '#/components/schemas/AudioBookmark'
          description: The user's bookmarks.
        isActive:
          type: boolean
          description: Whether the user's account is active.
        isLocked:
          type:
            - boolean
            - 'null'
          description: Whether the user is disabled.
        lastSeen:
          type:
            - integer
            - 'null'
          description: >-
            The time (in ms since POSIX epoch) when the user was last seen by
            the server. Will be null if the user has never logged in.
        createdAt: &ref_40
          $ref: '#/components/schemas/createdAt'
          description: The time when the user was created
        permissions:
          description: The user's permissions.
          $ref: '#/components/schemas/UserPermissions'
        librariesAccessible:
          type:
            - array
            - 'null'
          items: *ref_34
          description: Libraries accessible to the user. Wil be empty if all are accessible
        itemTagsAccessible:
          anyOf:
            - &ref_38
              $ref: '#/components/schemas/tags'
            - type: 'null'
          description: Tags accessible to the user. Wil be empty if all are accessible
        itemTagsSelected:
          anyOf:
            - *ref_38
            - type: 'null'
        hasOpenIDLink:
          type: boolean
          description: If the user has an active OpenIDLink
      required:
        - permissions
        - createdAt
        - isActive
        - bookmarks
        - seriesHideFromContinueListening
        - mediaProgress
        - hasOpenIDLink
    AudioBookmark:
      type: object
      properties:
        libraryItemId: *ref_39
        title:
          type: string
          description: The title of the bookmark.
        time:
          type: integer
          description: The time (in seconds) the bookmark is at in the book.
        createdAt: *ref_40
    MediaProgress:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/progressId'
        libraryItemId: *ref_39
        episodeId: &ref_66
          $ref: '#/components/schemas/episodeId'
        duration:
          type: number
          description: >-
            The total duration (in seconds) of the media. Will be 0 if the media
            was marked as finished without the user listening to it.
        progress:
          type: number
          description: >-
            The percentage completion progress of the media. Will be 1 if the
            media is finished.
        currentTime:
          type: number
          description: >-
            The current time (in seconds) of the user's progress. If the media
            has been marked as finished, this will be the time the user was at
            beforehand.
        isFinished:
          type: boolean
          description: Whether the media is finished.
        hideFromContinueListening:
          type: boolean
          description: >-
            Whether the media will be hidden from the "Continue Listening"
            shelf.
        lastUpdate: &ref_41
          $ref: '#/components/schemas/timeSincePOSIX'
        startedAt: *ref_41
        finishedAt: *ref_41
    ServerSettings:
      type: object
      properties:
        id:
          type: string
          description: The ID of the server settings.
        scannerFindCovers:
          type: boolean
          description: >-
            Whether the scanner will attempt to find a cover if your audiobook
            does not have an embedded cover or a cover image inside the folder.
            Note: This will extend scan time.
        scannerCoverProvider:
          type:
            - string
            - 'null'
          description: If scannerFindCovers is true, which metadata provider to use.
        scannerParseSubtitle:
          type:
            - boolean
            - 'null'
          description: >-
            Whether to extract subtitles fromWhether to disable the automatic
            adding/updating of items when file changes are detected. Requires
            server restart for changes to take effect audiobook folder names.
            SubtitleWhether matched data will override item details when using
            Quick Match. By default, Quick Match will only fill in missing
            details.s must be separated by -, i.e. /audiobooks/Book Title - A
            Subtitle Here/ has the subtitle A Subtitle Here.
        scannerPreferMatchedMetadata:
          type:
            - boolean
            - 'null'
          description: >-
            Whether to store covers in the library item's folder. By default,
            covers are stored in /metadata/items. Only one file named cover will
            be kept.
        scannerDisableWatcher:
          type:
            - boolean
            - 'null'
        storeCoverWithItem:
          type:
            - boolean
            - 'null'
        storeMetadataWithItem:
          type:
            - boolean
            - 'null'
          description: >-
            Whether to store metadata files in the library item's folder. By
            default, metadata files are stored in /metadata/items. Uses the .abs
            file extension.
        metadataFileFormat:
          type:
            - string
            - 'null'
          description: Must be either json or abs
        rateLimitLoginRequests:
          type:
            - integer
            - 'null'
          description: The maximum number of login requests per rateLimitLoginWindow.
        rateLimitLoginWindow:
          type:
            - integer
            - 'null'
          description: The length (in ms) of each login rate limit window.
        backupSchedule:
          type:
            - string
            - integer
            - boolean
            - array
            - object
            - number
            - 'null'
          description: The cron expression for when to do automatic backups.
        backupsToKeep:
          type:
            - integer
            - 'null'
          description: The number of backups to keep.
        maxBackupSize:
          type:
            - integer
            - 'null'
          description: >-
            The maximum backup size (in GB) before they fail, a safeguard
            against misconfiguration.
        loggerDailyLogsToKeep:
          type:
            - integer
            - 'null'
          description: The number of daily logs to keep.
        loggerScannerLogsToKeep:
          type:
            - integer
            - 'null'
          description: The number of scanner logs to keep.
        homeBookshelfView:
          type:
            - integer
            - 'null'
          description: >-
            Whether the home page should use a skeuomorphic design with wooden
            shelves.
        bookshelfView:
          type:
            - integer
            - 'null'
          description: >-
            Whether other bookshelf pages should use a skeuomorphic design with
            wooden shelves.
        sortingIgnorePrefix:
          type:
            - boolean
            - 'null'
          description: >-
            Whether to ignore prefixes when sorting. For example, for the prefix
            the, the book title The Book Title would sort as Book Title, The.
        sortingPrefixes:
          type:
            - array
            - 'null'
          items:
            type: string
            description: If sortingIgnorePrefix is true, what prefixes to ignore.
          description: If sortingIgnorePrefix is true, what prefixes to ignore.
        chromecastEnabled:
          type:
            - boolean
            - 'null'
          description: Whether to enable streaming to Chromecast devices.
        allowIframe:
          type: boolean
          description: Whether to allow iFrames
        dateFormat:
          type:
            - string
            - 'null'
          description: >-
            What date format to use. Options are MM/dd/yyyy, dd/MM/yyyy,
            dd.MM.yyyy, yyyy-MM-dd, MMM do, yyyy, MMMM do, yyyy, dd MMM yyyy, or
            dd MMMM yyyy.
        timeFormat:
          type: string
          description: >-
            What time format to use. Options are HH:mm (24-hour) and h:mma
            (am/pm).
        language:
          type: string
          description: The default server language.
        logLevel:
          type: integer
          description: >-
            What log level the server should use when logging. 1 for debug, 2
            for info, or 3 for warnings.
        version:
          type: string
          description: The server's version.
        backupPath:
          type: string
          description: The path to the backup
        podcastEpisodeSchedule:
          type: string
          description: The cron expression for default podcasts
        buildNumber:
          type: integer
        authLoginCustomMessage:
          type: string
          description: html displayed in the login page
        authActiveAuthMethods:
          type: array
          items:
            type: string
          description: Enabled Auth methods
        authOpenIDIssuerURL:
          type:
            - string
            - 'null'
        authOpenIDAuthorizationURL:
          type:
            - string
            - 'null'
        authOpenIDTokenURL:
          type:
            - string
            - 'null'
        authOpenIDUserInfoURL:
          type:
            - string
            - 'null'
        authOpenIDJwksURL:
          type:
            - string
            - 'null'
        authOpenIDLogoutURL:
          type:
            - string
            - 'null'
        authOpenIDTokenSigningAlgorithm:
          type:
            - string
            - 'null'
        authOpenIDButtonText:
          type:
            - string
            - 'null'
        authOpenIDAutoLaunch:
          type:
            - boolean
            - 'null'
        authOpenIDAutoRegister:
          type:
            - boolean
            - 'null'
        authOpenIDMatchExistingBy:
          type:
            - string
            - 'null'
      required:
        - version
        - logLevel
        - scannerFindCovers
        - scannerCoverProvider
        - scannerParseSubtitle
        - scannerPreferMatchedMetadata
        - scannerDisableWatcher
        - storeCoverWithItem
        - storeMetadataWithItem
        - metadataFileFormat
        - rateLimitLoginRequests
        - rateLimitLoginWindow
        - backupSchedule
        - backupsToKeep
        - maxBackupSize
        - loggerDailyLogsToKeep
        - loggerScannerLogsToKeep
        - homeBookshelfView
        - bookshelfView
        - sortingIgnorePrefix
        - sortingPrefixes
        - chromecastEnabled
        - allowIframe
        - dateFormat
        - timeFormat
        - language
        - backupPath
        - podcastEpisodeSchedule
        - buildNumber
        - authLoginCustomMessage
        - authActiveAuthMethods
    libraryItemBase:
      type: object
      description: Base library item schema
      properties:
        id: *ref_39
        oldLibraryItemId:
          $ref: '#/components/schemas/oldLibraryItemId'
        ino: &ref_63
          $ref: '#/components/schemas/inode'
        libraryId: *ref_34
        folderId: *ref_42
        path:
          description: The path of the library item on the server.
          type: string
        relPath:
          description: The path, relative to the library folder, of the library item.
          type: string
        isFile:
          description: >-
            Whether the library item is a single file in the root of the library
            folder.
          type: boolean
        mtimeMs:
          description: >-
            The time (in ms since POSIX epoch) when the library item was last
            modified on disk.
          type: integer
        ctimeMs:
          description: >-
            The time (in ms since POSIX epoch) when the library item status was
            changed on disk.
          type: integer
        birthtimeMs:
          description: >-
            The time (in ms since POSIX epoch) when the library item was created
            on disk. Will be 0 if unknown.
          type: integer
        addedAt: &ref_50
          $ref: '#/components/schemas/addedAt'
        updatedAt: &ref_51
          $ref: '#/components/schemas/updatedAt'
        isMissing:
          description: Whether the library item was scanned and no longer exists.
          type: boolean
        isInvalid:
          description: Whether the library item was scanned and no longer has media files.
          type: boolean
        mediaType: *ref_43
    bookMetadataBase:
      type: object
      description: >-
        The base book metadata object for minified, normal, and extended schemas
        to inherit from.
      properties:
        title:
          description: The title of the book. Will be null if unknown.
          type:
            - string
            - 'null'
          examples:
            - Wizards First Rule
        subtitle:
          description: The subtitle of the book. Will be null if there is no subtitle.
          type:
            - string
            - 'null'
        genres:
          description: The genres of the book.
          type: array
          items:
            type: string
          examples:
            - - Fantasy
              - Sci-Fi
              - 'Nonfiction: History'
        publishedYear:
          description: The year the book was published. Will be null if unknown.
          type:
            - string
            - 'null'
          examples:
            - '2008'
        publishedDate:
          description: The date the book was published. Will be null if unknown.
          type:
            - string
            - 'null'
        publisher:
          description: The publisher of the book. Will be null if unknown.
          type:
            - string
            - 'null'
          examples:
            - Brilliance Audio
        description:
          description: A description for the book. Will be null if empty.
          type:
            - string
            - 'null'
          examples:
            - >-
              The masterpiece that started Terry Goodkind's New York Times
              bestselling epic Sword of Truth In the aftermath of the brutal
              murder of his father, a mysterious woman, Kahlan Amnell, appears
              in Richard Cypher's forest sanctuary seeking help...and more. His
              world, his very beliefs, are shattered when ancient debts come due
              with thundering violence. In a dark age it takes courage to live,
              and more than mere courage to challenge those who hold dominion,
              Richard and Kahlan must take up that challenge or become the next
              victims. Beyond awaits a bewitching land where even the best of
              their hearts could betray them. Yet, Richard fears nothing so much
              as what secrets his sword might reveal about his own soul. Falling
              in love would destroy them - for reasons Richard can't imagine and
              Kahlan dare not say. In their darkest hour, hunted relentlessly,
              tormented by treachery and loss, Kahlan calls upon Richard to
              reach beyond his sword - to invoke within himself something more
              noble. Neither knows that the rules of battle have just
              changed...or that their time has run out. Wizard's First Rule is
              the beginning. One book. One Rule. Witness the birth of a legend.
        isbn:
          description: The ISBN of the book. Will be null if unknown.
          type:
            - string
            - 'null'
        asin:
          description: The ASIN of the book. Will be null if unknown.
          type:
            - string
            - 'null'
          examples:
            - B002V0QK4C
        language:
          description: The language of the book. Will be null if unknown.
          type:
            - string
            - 'null'
        explicit:
          description: Whether the book has been marked as explicit.
          type: boolean
          examples:
            - false
    bookMetadataMinified:
      description: The minified metadata for a book in the database.
      allOf:
        - $ref: '#/components/schemas/bookMetadataBase'
        - type: object
          properties:
            titleIgnorePrefix:
              description: The title of the book with any prefix moved to the end.
              type: string
            authorName:
              description: The name of the book's author(s).
              type: string
              examples:
                - Terry Goodkind
            authorNameLF:
              description: The name of the book's author(s) with last names first.
              type: string
              examples:
                - Goodkind, Terry
            narratorName:
              description: The name of the audiobook's narrator(s).
              type: string
              examples:
                - Sam Tsoutsouvas
            seriesName:
              description: The name of the book's series.
              type: string
              examples:
                - Sword of Truth
    bookMinified:
      type: object
      description: >-
        Minified book schema. Does not depend on `bookBase` because there's
        pretty much no overlap.
      properties:
        metadata:
          $ref: '#/components/schemas/bookMetadataMinified'
        coverPath:
          $ref: '#/components/schemas/bookCoverPath'
        tags: *ref_38
        numTracks:
          description: The number of tracks the book's audio files have.
          type: integer
          examples:
            - 1
        numAudioFiles:
          description: The number of audio files the book has.
          type: integer
          examples:
            - 1
        numChapters:
          description: The number of chapters the book has.
          type: integer
          examples:
            - 1
        numMissingParts:
          description: The total number of missing parts the book has.
          type: integer
          examples:
            - 0
        numInvalidAudioFiles:
          description: The number of invalid audio files the book has.
          type: integer
          examples:
            - 0
        duration: &ref_64
          $ref: '#/components/schemas/durationSec'
        size: &ref_62
          $ref: '#/components/schemas/size'
        ebookFormat:
          description: >-
            The format of ebook of the book. Will be null if the book is an
            audiobook.
          type:
            - string
            - 'null'
    mediaMinified:
      description: The minified media of the library item.
      oneOf:
        - $ref: '#/components/schemas/bookMinified'
    libraryItemMinified:
      description: >-
        A single item on the server, like a book or podcast. Minified media
        format.
      allOf:
        - *ref_44
        - type: object
          properties:
            media:
              $ref: '#/components/schemas/mediaMinified'
    seriesId:
      type: string
      description: The ID of the series.
      format: uuid
      examples:
        - e4bb1afb-4a4f-4dd6-8be0-e615d233185b
    authorSeries:
      type: object
      description: Series and the included library items that an author has written.
      properties:
        id: *ref_45
        name: *ref_46
        items:
          description: >-
            The items in the series. Each library item's media's metadata will
            have a `series` attribute, a `Series Sequence`, which is the
            matching series.
          type: array
          items: &ref_52
            $ref: '#/components/schemas/libraryItemMinified'
    author:
      description: >-
        An author object which includes a description and image path. The
        library items and series associated with the author are optionally
        included.
      type: object
      properties:
        id:
          $ref: '#/components/schemas/authorId'
        asin: *ref_5
        name: *ref_47
        description: *ref_48
        imagePath: *ref_49
        addedAt: *ref_50
        updatedAt: *ref_51
        libraryItems:
          description: The items associated with the author
          type: array
          items: *ref_52
        series:
          description: The series associated with the author
          type: array
          items:
            $ref: '#/components/schemas/authorSeries'
    EreaderDeviceObject:
      type: object
      description: An e-reader device configured to receive EPUB through e-mail.
      properties:
        name: *ref_53
        email:
          type: string
          description: The email address associated with the e-reader device.
        availabilityOption:
          type: string
          description: The availability option for the device.
          enum:
            - adminOrUp
            - userOrUp
            - guestOrUp
            - specificUsers
        users:
          type: array
          description: List of specific users allowed to access the device.
          items:
            type: string
      required:
        - name
        - email
        - availabilityOption
    EmailSettings:
      type: object
      description: >-
        The email settings configuration for the server. This includes the
