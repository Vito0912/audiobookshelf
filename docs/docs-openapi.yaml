          type: array
          items:
            type: string
          examples:
            - - folderStructure
              - audioMetatags
              - nfoFile
              - txtFiles
              - opfFile
              - absMetadata
        podcastSearchRegion:
          description: The region to use when searching for podcasts.
          type: string
          examples:
            - us
    library:
